name: Target certification

on:
  pull_request:
    paths:
      - ".github/workflows/target-certification.yml"
      - "catalog/**"
      - "cmd/mds-evidence/**"
      - "internal/evidence/**"
      - ".gitleaks.toml"
      - "scripts/certify-target.sh"
      - "scripts/certification-clock.sh"
      - "scripts/prepare-target-certification.sh"
      - "scripts/install-gitleaks.sh"
      - "scripts/install-gitleaks.ps1"
      - "scripts/verify-target-evidence.sh"
      - "tests/target-evidence/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/target-certification.yml"
      - "catalog/**"
      - "cmd/mds-evidence/**"
      - "internal/evidence/**"
      - ".gitleaks.toml"
      - "scripts/certify-target.sh"
      - "scripts/certification-clock.sh"
      - "scripts/prepare-target-certification.sh"
      - "scripts/install-gitleaks.sh"
      - "scripts/install-gitleaks.ps1"
      - "scripts/verify-target-evidence.sh"
      - "tests/target-evidence/**"
  workflow_dispatch:
    inputs:
      target_id:
        description: Explicit target ID, for example lima-guest:mds
        required: true
        type: string
      cohort:
        description: Immutable cohort cert-YYYYMMDDThhmmssZ-commit8 shared by all four targets
        required: true
        type: string
      expected_cli_revision:
        description: Exact reviewed CLI revision from the release
        required: true
        type: string
      expected_catalog_revision:
        description: Exact reviewed catalog revision from the release
        required: true
        type: string
      expected_plan_digest:
        description: Exact reviewed certification profile plan digest for this target
        required: true
        type: string
      expected_guest_creation_nonce_commitment:
        description: Host-reviewed sha256 commitment from mds-evidence prepare; guest targets only
        required: false
        type: string
      expected_binary_sha256:
        description: SHA-256 of the exact release mds binary on this target
        required: true
        type: string
      runner_label:
        description: Target-specific self-hosted runner label
        required: true
        default: mds-lima-guest
        type: choice
        options:
          - mds-macos-host
          - mds-windows-host
          - mds-wsl-guest
          - mds-lima-guest

permissions:
  contents: read

concurrency:
  group: target-certification-${{ github.sha }}-${{ inputs.cohort || 'contract' }}-${{ inputs.target_id || 'contract' }}
  cancel-in-progress: false

jobs:
  fixture-contract:
    name: Fixture contract (implemented only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify evidence contract and tamper fixtures
        run: go test ./internal/evidence ./cmd/mds-evidence
      - name: Record non-target status
        run: |
          {
            echo "## Target certification"
            echo
            echo "Hosted fixture status: \`implemented\`."
            echo "No actual target was certified and this job must not be read as \`verified\`."
          } >> "$GITHUB_STEP_SUMMARY"

  fixture-contract-windows:
    name: Fixture contract (Windows scanner)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: powershell
        run: scripts/install-gitleaks.ps1 -OutputDirectory "$env:RUNNER_TEMP/mds-tools"
      - name: Scan fixture evidence
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/mds-tools/gitleaks.exe" dir `
            --no-banner --redact --config .gitleaks.toml `
            tests/target-evidence

  actual-target:
    name: Actual target
    # The protected GitHub ref is the certification authority. The dispatcher
    # cannot substitute a commit, and fork/PR events never reach self-hosted
    # target runners. Runner labels must be dedicated and credential-free.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.event.repository.fork == false &&
        github.ref_protected == true
      }}
    runs-on:
      - self-hosted
      - ${{ inputs.runner_label }}
    environment: target-certification
    permissions:
      contents: read
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate immutable certification identity
        id: certification-identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          TARGET_ID: ${{ inputs.target_id }}
          CERTIFICATION_COHORT: ${{ inputs.cohort }}
          EXPECTED_GUEST_CREATION_NONCE_COMMITMENT: ${{ inputs.expected_guest_creation_nonce_commitment }}
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]]; then
            echo "expected_commit must be a full lowercase commit SHA" >&2
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [[ ! "$CERTIFICATION_COHORT" =~ ^cert-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]] ||
            [[ "${CERTIFICATION_COHORT##*-}" != "${EXPECTED_COMMIT:0:8}" ]]; then
            echo "certification cohort must be canonical and match the protected commit" >&2
            exit 2
          fi
          case "$TARGET_ID" in
            macos-host:local)
              target_kind=macos-host
              expected_runner_label=mds-macos-host
              certification_profile=certification-macos-host
              mds_path=/usr/local/bin/mds
              expected_guest_commitment=
              ;;
            windows-host:local)
              target_kind=windows-host
              expected_runner_label=mds-windows-host
              certification_profile=certification-windows-host
              mds_path=C:/ProgramData/my-desk-setup/bin/mds.exe
              expected_guest_commitment=
              ;;
            wsl-guest:Ubuntu-26.04)
              target_kind=wsl-guest
              expected_runner_label=mds-wsl-guest
              certification_profile=certification-wsl-guest
              mds_path=/usr/local/bin/mds
              expected_guest_commitment=$EXPECTED_GUEST_CREATION_NONCE_COMMITMENT
              ;;
            lima-guest:mds)
              target_kind=lima-guest
              expected_runner_label=mds-lima-guest
              certification_profile=certification-lima-guest
              mds_path=/usr/local/bin/mds
              expected_guest_commitment=$EXPECTED_GUEST_CREATION_NONCE_COMMITMENT
              ;;
            *)
              echo "unsupported promotion target ID: $TARGET_ID" >&2
              exit 2
              ;;
          esac
          test "$RUNNER_LABEL" = "$expected_runner_label"
          if [[ "$target_kind" == *-guest ]]; then
            if [[ ! "$expected_guest_commitment" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "guest target requires the reviewed nonce commitment from mds-evidence prepare" >&2
              exit 2
            fi
          elif test -n "$EXPECTED_GUEST_CREATION_NONCE_COMMITMENT"; then
            echo "host target must not receive a guest nonce commitment" >&2
            exit 2
          fi
          {
            echo "target_kind=$target_kind"
            echo "certification_profile=$certification_profile"
            echo "cohort=$CERTIFICATION_COHORT"
            echo "mds_path=$mds_path"
            echo "expected_guest_commitment=$expected_guest_commitment"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare target-local evidence path
        shell: bash
        run: |
          echo "EVIDENCE_OUTPUT=$RUNNER_TEMP/mds-target-evidence/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Verify runner clock against GitHub
        shell: bash
        run: scripts/certification-clock.sh verify
      - name: Capture actual target evidence
        continue-on-error: true
        shell: bash
        env:
          MDS_PATH: ${{ steps.certification-identity.outputs.mds_path }}
          TARGET_ID: ${{ inputs.target_id }}
          EXPECTED_BINARY_SHA256: ${{ inputs.expected_binary_sha256 }}
          CERTIFICATION_PROFILE: ${{ steps.certification-identity.outputs.certification_profile }}
          CERTIFICATION_COHORT: ${{ steps.certification-identity.outputs.cohort }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          EXPECTED_GUEST_CREATION_NONCE_COMMITMENT: ${{ steps.certification-identity.outputs.expected_guest_commitment }}
        run: |
          case "$TARGET_ID" in
            wsl-guest:Ubuntu-26.04)
              if [[ "${WSL_DISTRO_NAME:-}" != Ubuntu-26.04 ]]; then
                echo "WSL guest runner service must inherit WSL_DISTRO_NAME=Ubuntu-26.04" >&2
                exit 2
              fi
              ;;
            lima-guest:mds)
              if [[ "${LIMA_INSTANCE:-}" != mds ]]; then
                echo "Lima guest runner service must inherit LIMA_INSTANCE=mds" >&2
                exit 2
              fi
              ;;
          esac
          commitment_arguments=()
          if test -n "$EXPECTED_GUEST_CREATION_NONCE_COMMITMENT"; then
            commitment_arguments=(
              --expected-guest-creation-nonce-commitment
              "$EXPECTED_GUEST_CREATION_NONCE_COMMITMENT"
            )
          fi
          scripts/certify-target.sh \
            --mds "$MDS_PATH" \
            --target "$TARGET_ID" \
            --output "$EVIDENCE_OUTPUT" \
            --cohort "$CERTIFICATION_COHORT" \
            --expected-binary-sha256 "$EXPECTED_BINARY_SHA256" \
            --expected-plan-digest "$EXPECTED_PLAN_DIGEST" \
            "${commitment_arguments[@]}" \
            --profile "$CERTIFICATION_PROFILE"
      - name: Verify against reviewed release and plan
        if: always()
        shell: bash
        env:
          EXPECTED_CLI_REVISION: ${{ inputs.expected_cli_revision }}
          EXPECTED_CATALOG_REVISION: ${{ inputs.expected_catalog_revision }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          EXPECTED_BINARY_SHA256: ${{ inputs.expected_binary_sha256 }}
          TARGET_ID: ${{ inputs.target_id }}
          CERTIFICATION_COHORT: ${{ steps.certification-identity.outputs.cohort }}
        run: |
          scripts/verify-target-evidence.sh \
            --bundle "$EVIDENCE_OUTPUT" \
            --expected-cli-revision "$EXPECTED_CLI_REVISION" \
            --expected-catalog-revision "$EXPECTED_CATALOG_REVISION" \
            --expected-plan-digest "$EXPECTED_PLAN_DIGEST" \
            --expected-target "$TARGET_ID" \
            --expected-binary-sha256 "$EXPECTED_BINARY_SHA256" \
            --expected-cohort "$CERTIFICATION_COHORT" \
            --max-age 45m \
            --require-verified
      - name: Verify runner workspace remained pristine
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -n "$(git status --porcelain=v1 --untracked-files=all)"; then
            git status --short
            echo "certification modified the checked-out runner workspace" >&2
            exit 1
          fi
      - name: Install pinned Gitleaks on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/install-gitleaks.ps1 -OutputDirectory "$env:RUNNER_TEMP/mds-tools"
      - name: Install pinned Gitleaks on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/install-gitleaks.sh "$RUNNER_TEMP/mds-tools"
      - name: Scan verified evidence before upload
        shell: bash
        run: |
          mds_gitleaks="$RUNNER_TEMP/mds-tools/gitleaks"
          if [[ "$RUNNER_OS" == Windows ]]; then
            mds_gitleaks="$RUNNER_TEMP/mds-tools/gitleaks.exe"
          fi
          "$mds_gitleaks" dir \
            --no-banner --redact --config .gitleaks.toml \
            "$EVIDENCE_OUTPUT"
          if grep -R -q -E '"(image_)?creation_nonce"[[:space:]]*:' \
            "$EVIDENCE_OUTPUT"; then
            echo "verified evidence contains a raw guest creation nonce field" >&2
            exit 1
          fi
      - name: Upload verified certification output
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: target-evidence-${{ steps.certification-identity.outputs.target_kind }}-${{ github.sha }}-${{ steps.certification-identity.outputs.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
