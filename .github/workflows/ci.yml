name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/mds
      - name: Verify repository identity
        env:
          MDS_EXPECT_REMOTE_URL: https://github.com/${{ github.repository }}.git
        run: go test ./tests/integration -run TestRepositoryIdentity
