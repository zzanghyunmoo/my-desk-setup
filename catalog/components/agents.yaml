schema_version: 1
components:
  - id: claude-code
    name: Claude Code
    kind: agent
    provides: [claude-code]
    dependencies: [bun]
    version_policy:
      mode: pinned
      lock_key: claude-code
    verification:
      command: [claude, --version]
    targets:
      macos-host:
        status: supported
        installer: bun
        package: "@anthropic-ai/claude-code"
      windows-host:
        status: supported
        installer: bun
        package: "@anthropic-ai/claude-code"
      wsl-guest:
        status: supported
        installer: bun
        package: "@anthropic-ai/claude-code"
      lima-guest:
        status: supported
        installer: bun
        package: "@anthropic-ai/claude-code"

