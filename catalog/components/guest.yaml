    targets:
      macos-host:
        status: unsupported
        reason: Language toolchains belong to the Linux guest.
      windows-host:
        status: unsupported
        reason: Language toolchains belong to the Linux guest.
      wsl-guest:
        status: supported
        installer: apt
        package: rustc cargo
      lima-guest:
        status: supported
        installer: apt
        package: rustc cargo

  - id: xmake
    name: xmake
    kind: build
    provides: [xmake]
    dependencies: [c-toolchain]
    version_policy:
      mode: manager
    verification:
      command: [xmake, --version]
    targets:
      macos-host:
        status: unsupported
        reason: Build tools belong to the Linux guest.
      windows-host:
        status: unsupported
        reason: Build tools belong to the Linux guest.
      wsl-guest:
        status: supported
