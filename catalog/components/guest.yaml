        installer: mise
        package: gradle

  - id: uv
    name: uv
    kind: build
    provides: [uv, python-package-manager]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: uv
    verification:
      command: [uv, --version]
    targets:
      macos-host:
