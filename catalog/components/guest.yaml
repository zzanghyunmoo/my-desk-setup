      windows-host:
        status: unsupported
        reason: The managed IDE tooling belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: apt
        package: clangd clang-format clang-tidy lldb gopls delve python3-debugpy
      lima-guest:
        status: supported
        installer: apt
        package: clangd clang-format clang-tidy lldb gopls delve python3-debugpy

