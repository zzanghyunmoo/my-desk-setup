schema_version: 1
components:
  - id: base-cli
    name: Linux Base CLI
    kind: cli
    provides: [base-cli, git, curl, archive-tools]
    dependencies: []
    version_policy:
      mode: manager
    verification:
      command: [git, --version]
    targets:
      macos-host:
        status: action-required
        reason: Install Command Line Tools with `xcode-select --install` before applying host-managed tools.
      windows-host:
        status: action-required
        reason: Install Git for Windows and curl before applying host-managed tools.
      wsl-guest:
        status: supported
        installer: apt
        package: git curl ca-certificates unzip zip jq
      lima-guest:
        status: supported
        installer: apt
        package: git curl ca-certificates unzip zip jq

  - id: bun
    name: Bun
    kind: build
    provides: [bun, javascript-runtime, package-manager]
    dependencies: []
    version_policy:
      mode: pinned
      lock_key: bun
    verification:
      command: [bun, --version]
      functional: [bun, -e, "console.log('ok')"]
    targets:
      macos-host:
        status: supported
        installer: vendor
        package: bun
      windows-host:
        status: supported
        installer: vendor
        package: bun
      wsl-guest:
        status: supported
        installer: vendor
        package: bun
      lima-guest:
        status: supported
        installer: vendor
        package: bun

  - id: mise
    name: mise
    kind: build
    provides: [mise, tool-version-manager]
    dependencies: [base-cli]
    version_policy:
      mode: pinned
      lock_key: mise
    verification:
      command: [mise, --version]
    targets:
      macos-host:
        status: action-required
        reason: Install mise on macOS from its reviewed release before installing pinned language toolchains.
      windows-host:
        status: action-required
        reason: Install mise on Windows from its reviewed release before installing pinned language toolchains.
      wsl-guest:
        status: supported
        installer: vendor
        package: mise
      lima-guest:
        status: supported
        installer: vendor
        package: mise

  - id: java
    name: Java
    kind: language
    provides: [java, jdk]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: java
    verification:
      command: [java, --version]
      functional: [javac, -version]
    targets:
      macos-host:
        status: action-required
        reason: Install a Java 25 JDK on macOS, then verify `java --version` and `javac -version`.
      windows-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      wsl-guest:
        status: unsupported
        reason: WSL and Lima guests are limited to Go, C/C++, and Python.
      lima-guest:
        status: unsupported
        reason: WSL and Lima guests are limited to Go, C/C++, and Python.

  - id: kotlin
    name: Kotlin
    kind: language
    provides: [kotlin, kotlinc]
    dependencies: [java, mise]
    version_policy:
      mode: pinned
      lock_key: kotlin
    verification:
      command: [kotlinc, -version]
    targets:
      macos-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      windows-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      wsl-guest:
        status: unsupported
        reason: WSL and Lima guests are limited to Go, C/C++, and Python.
      lima-guest:
        status: unsupported
        reason: WSL and Lima guests are limited to Go, C/C++, and Python.

  - id: go
    name: Go
    kind: language
    provides: [go, go-toolchain]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: go
    verification:
      command: [go, version]
      functional: [go, env, GOROOT]
    targets:
      macos-host:
        status: action-required
        reason: Install the pinned Go toolchain with mise after installing macOS base tools.
      windows-host:
        status: action-required
        reason: Install the pinned Go toolchain with mise after installing Windows base tools.
      wsl-guest:
        status: supported
        installer: mise
        package: go
      lima-guest:
        status: supported
        installer: mise
        package: go

  - id: python
    name: Python
    kind: language
    provides: [python, python3]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: python
    verification:
      command: [python, --version]
      functional: [python, -c, "print('ok')"]
    targets:
      macos-host:
        status: action-required
        reason: Install the pinned Python toolchain with mise after installing macOS base tools.
      windows-host:
        status: action-required
        reason: Install the pinned Python toolchain with mise after installing Windows base tools.
      wsl-guest:
        status: supported
        installer: mise
        package: python
      lima-guest:
        status: supported
        installer: mise
        package: python

  - id: typescript
    name: TypeScript
    kind: language
    provides: [typescript, tsc]
    dependencies: [bun]
    version_policy:
      mode: pinned
      lock_key: typescript
    verification:
      command: [tsc, --version]
      functional: [bun, -e, "const value: number = 1; console.log(value)"]
    targets:
      macos-host:
        status: supported
        installer: bun
        package: typescript
      windows-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      wsl-guest:
        status: supported
        installer: bun
        package: typescript
      lima-guest:
        status: supported
        installer: bun
        package: typescript

  - id: c-toolchain
    name: C Toolchain
    kind: language
    provides: [c, cc, build-essential]
    dependencies: [base-cli]
    version_policy:
      mode: manager
    verification:
      command: [cc, --version]
      functional: [cc, --help]
    targets:
      macos-host:
        status: action-required
        reason: Install macOS Command Line Tools with `xcode-select --install`.
      windows-host:
        status: action-required
        reason: Install MSVC Build Tools with the Desktop development with C++ workload.
      wsl-guest:
        status: supported
        installer: apt
        package: build-essential pkg-config
      lima-guest:
        status: supported
        installer: apt
        package: build-essential pkg-config

  - id: flutter
    name: Flutter and Dart
    kind: language
    provides: [flutter, dart]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: flutter
    verification:
      command: [flutter, --version]
      functional: [flutter, doctor]
    targets:
      macos-host:
        status: unsupported
        reason: Primary Flutter work belongs to the Linux guest; iOS signing uses the Xcode exception.
      windows-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      wsl-guest:
        status: unsupported
        reason: WSL and Lima guests are limited to Go, C/C++, and Python.
      lima-guest:
        status: unsupported
        reason: WSL and Lima guests are limited to Go, C/C++, and Python.

  - id: gradle
    name: Gradle
    kind: build
    provides: [gradle]
    dependencies: [java, mise]
    version_policy:
      mode: pinned
      lock_key: gradle
    verification:
      command: [gradle, --version]
    targets:
      macos-host:
        status: unsupported
        reason: Build tools belong to the Linux guest.
      windows-host:
        status: unsupported
        reason: Build tools belong to the Linux guest.
      wsl-guest:
        status: unsupported
        reason: WSL and Lima guests are limited to Go, C/C++, and Python.
      lima-guest:
        status: unsupported
        reason: WSL and Lima guests are limited to Go, C/C++, and Python.

  - id: uv
    name: uv
    kind: build
    provides: [uv, python-package-manager]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: uv
    verification:
      command: [uv, --version]
    targets:
      macos-host:
        status: unsupported
        reason: Build tools belong to the Linux guest.
      windows-host:
        status: unsupported
        reason: Build tools belong to the Linux guest.
      wsl-guest:
        status: supported
        installer: mise
        package: uv
      lima-guest:
        status: supported
        installer: mise
        package: uv

  - id: neovim
    name: Neovim
    kind: editor
    provides: [neovim, nvim]
    dependencies: [base-cli]
    version_policy:
      mode: pinned
      lock_key: neovim
    verification:
      command: [nvim, --version]
      functional: [nvim, --headless, "+quit"]
    targets:
      macos-host:
        status: action-required
        reason: Install the reviewed Neovim release on macOS, then apply the NvChad configuration.
      windows-host:
        status: unsupported
        reason: The primary editor belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: vendor
        package: neovim
      lima-guest:
        status: supported
        installer: vendor
        package: neovim

  - id: nvchad
    name: NvChad-derived Configuration
    kind: editor
    provides: [nvchad, neovim-config]
    dependencies: [neovim]
    version_policy:
      mode: pinned
      lock_key: nvchad
    verification:
      command: [nvim, --headless, "+checkhealth", "+quit"]
    targets:
      macos-host:
        status: action-required
        reason: Apply NvChad after the macOS Neovim installation is verified.
      windows-host:
        status: unsupported
        reason: The primary editor belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: script
        package: nvchad-derived
      lima-guest:
        status: supported
        installer: script
        package: nvchad-derived

  - id: nvim-ide-tools
    name: C++ Go Python Neovim IDE Tools
    kind: editor
    provides: [nvim-ide-tools, cxx-lsp, go-lsp, nvim-debugger, nvim-linter, nvim-formatter]
    dependencies: [c-toolchain, go, python, nvchad, pyright]
    version_policy:
      mode: manager
    verification:
      command: [clangd, --version]
      functional: [gopls, version]
    targets:
      macos-host:
        status: unsupported
        reason: The managed IDE tooling belongs to the Linux guest.
      windows-host:
        status: unsupported
        reason: The managed IDE tooling belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: apt
        package: clangd clang-format clang-tidy lldb gopls delve python3-ruff python3-debugpy
      lima-guest:
        status: supported
        installer: apt
        package: clangd clang-format clang-tidy lldb gopls delve python3-ruff python3-debugpy

  - id: pyright
    name: Pyright Python Language Server
    kind: editor
    provides: [pyright, python-lsp]
    dependencies: [bun]
    version_policy:
      mode: pinned
      lock_key: pyright
    verification:
      command: [pyright, --version]
    targets:
      macos-host:
        status: unsupported
        reason: The managed IDE tooling belongs to the Linux guest.
      windows-host:
        status: unsupported
        reason: The managed IDE tooling belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: bun
        package: pyright
      lima-guest:
        status: supported
        installer: bun
        package: pyright

  - id: herdr
    name: Herdr
    kind: terminal
    provides: [herdr]
    dependencies: []
    version_policy:
      mode: pinned
      lock_key: herdr
    verification:
      command: [herdr, --version]
    targets:
      macos-host:
        status: supported
        installer: vendor
        package: herdr
      windows-host:
        status: action-required
        reason: Install the official Windows beta with `powershell -ExecutionPolicy Bypass -c "irm https://herdr.dev/install.ps1 | iex"`.
      wsl-guest:
        status: unsupported
        reason: Herdr belongs to the macOS or Windows host workspace.
      lima-guest:
        status: unsupported
        reason: Herdr belongs to the macOS or Windows host workspace.

  - id: atlassian-cli
    name: Atlassian CLI
    kind: cli
    provides: [atlassian-cli, jira-cli, confluence-cli]
    dependencies: [base-cli]
    version_policy:
      mode: pinned
      lock_key: atlassian-cli
    verification:
      command: [acli, --version]
    targets:
      macos-host:
        status: action-required
        reason: Install the reviewed Atlassian CLI release for macOS, then authenticate manually.
      windows-host:
        status: unsupported
        reason: Collaboration CLI belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: vendor
        package: acli
      lima-guest:
        status: supported
        installer: vendor
        package: acli

  - id: notion-cli
    name: Notion CLI
    kind: cli
    provides: [notion-cli]
    dependencies: [bun]
    version_policy:
      mode: pinned
      lock_key: notion-cli
    verification:
      command: [ntn, --version]
    targets:
      macos-host:
        status: supported
        installer: bun
        package: ntn
      windows-host:
        status: unsupported
        reason: Collaboration CLI belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: bun
        package: ntn
      lima-guest:
        status: supported
        installer: bun
        package: ntn

  - id: linear-cli
    name: Linear CLI
    kind: cli
    provides: [linear-cli]
    dependencies: [bun]
    version_policy:
      mode: pinned
      lock_key: linear-cli
    verification:
      command: [linear, --version]
    targets:
      macos-host:
        status: supported
        installer: bun
        package: "@schpet/linear-cli"
      windows-host:
        status: unsupported
        reason: Collaboration CLI belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: bun
        package: "@schpet/linear-cli"
      lima-guest:
        status: supported
        installer: bun
        package: "@schpet/linear-cli"

  - id: gh
    name: GitHub CLI
    kind: cli
    provides: [gh, github-cli]
    dependencies: []
    version_policy:
      mode: manager
    verification:
      command: [gh, --version]
    targets:
      macos-host:
        status: supported
        installer: brew
        package: gh
      windows-host:
        status: supported
        installer: winget
        package: GitHub.cli
      wsl-guest:
        status: supported
        installer: apt
        package: gh
      lima-guest:
        status: supported
        installer: apt
        package: gh

  - id: glab
    name: GitLab CLI
    kind: cli
    provides: [glab, gitlab-cli]
    dependencies: []
    version_policy:
      mode: manager
    verification:
      command: [glab, --version]
    targets:
      macos-host:
        status: supported
        installer: brew
        package: glab
      windows-host:
        status: unsupported
        reason: Collaboration CLI belongs to the Linux guest.
      wsl-guest:
        status: supported
        installer: apt
        package: glab
      lima-guest:
        status: supported
        installer: apt
        package: glab

  - id: docker-engine
    name: Docker Engine and CLI
    kind: container
    provides: [docker-engine, docker-cli, docker-compose]
    dependencies: [base-cli]
    version_policy:
      mode: manager
    verification:
      command: [docker, version]
      functional: [docker, info, --format, "{{.ServerVersion}}"]
    targets:
      macos-host:
        status: action-required
        reason: Install Docker Desktop for Mac, start the engine, and verify `docker version`.
      windows-host:
        status: unsupported
        reason: Docker Desktop and host Docker engine are outside v1.
      wsl-guest:
        status: supported
        installer: docker-apt
        package: docker-ce docker-ce-cli containerd.io docker-compose-plugin
      lima-guest:
        status: supported
        installer: docker-apt
        package: docker-ce docker-ce-cli containerd.io docker-compose-plugin
