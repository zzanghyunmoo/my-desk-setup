schema_version: 1
components:
  - id: base-cli
    name: Linux Base CLI
    kind: cli
    provides: [base-cli, git, curl, archive-tools]
    dependencies: []
    version_policy:
      mode: manager
    verification:
      command: [git, --version]
    targets:
      macos-host:
        status: action-required
        reason: Install Command Line Tools with `xcode-select --install` before applying host-managed tools.
      windows-host:
        status: action-required
        reason: Install Git for Windows and curl before applying host-managed tools.
      wsl-guest:
        status: supported
        installer: apt
        package: git curl ca-certificates unzip zip jq
      lima-guest:
        status: supported
        installer: apt
        package: git curl ca-certificates unzip zip jq

  - id: bun
    name: Bun
    kind: build
    provides: [bun, javascript-runtime, package-manager]
    dependencies: []
    version_policy:
      mode: pinned
      lock_key: bun
    verification:
      command: [bun, --version]
      functional: [bun, -e, "console.log('ok')"]
    targets:
      macos-host:
        status: supported
        installer: vendor
        package: bun
      windows-host:
        status: supported
        installer: vendor
        package: bun
      wsl-guest:
        status: supported
        installer: vendor
        package: bun
      lima-guest:
        status: supported
        installer: vendor
        package: bun

  - id: mise
    name: mise
    kind: build
    provides: [mise, tool-version-manager]
    dependencies: [base-cli]
    version_policy:
      mode: pinned
      lock_key: mise
    verification:
      command: [mise, --version]
    targets:
      macos-host:
        status: action-required
        reason: Install mise on macOS from its reviewed release before installing pinned language toolchains.
      windows-host:
        status: action-required
        reason: Install mise on Windows from its reviewed release before installing pinned language toolchains.
      wsl-guest:
        status: supported
        installer: vendor
        package: mise
      lima-guest:
        status: supported
        installer: vendor
        package: mise

  - id: java
    name: Java
    kind: language
    provides: [java, jdk]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: java
    verification:
      command: [java, --version]
      functional: [javac, -version]
    targets:
      macos-host:
        status: action-required
        reason: Install a Java 25 JDK on macOS, then verify `java --version` and `javac -version`.
      windows-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      wsl-guest:
        status: supported
        installer: mise
        package: java
      lima-guest:
        status: supported
        installer: mise
        package: java

  - id: kotlin
    name: Kotlin
    kind: language
    provides: [kotlin, kotlinc]
    dependencies: [java, mise]
    version_policy:
      mode: pinned
      lock_key: kotlin
    verification:
      command: [kotlinc, -version]
    targets:
      macos-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      windows-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      wsl-guest:
        status: supported
        installer: mise
        package: kotlin
      lima-guest:
        status: supported
        installer: mise
        package: kotlin

  - id: go
    name: Go
    kind: language
    provides: [go, go-toolchain]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: go
    verification:
      command: [go, version]
      functional: [go, env, GOROOT]
    targets:
      macos-host:
        status: action-required
        reason: Install the pinned Go toolchain with mise after installing macOS base tools.
      windows-host:
        status: action-required
        reason: Install the pinned Go toolchain with mise after installing Windows base tools.
      wsl-guest:
        status: supported
        installer: mise
        package: go
      lima-guest:
        status: supported
        installer: mise
        package: go

  - id: python
    name: Python
    kind: language
    provides: [python, python3]
    dependencies: [base-cli, mise]
    version_policy:
      mode: pinned
      lock_key: python
    verification:
      command: [python, --version]
      functional: [python, -c, "print('ok')"]
    targets:
      macos-host:
        status: action-required
        reason: Install the pinned Python toolchain with mise after installing macOS base tools.
      windows-host:
        status: action-required
        reason: Install the pinned Python toolchain with mise after installing Windows base tools.
      wsl-guest:
        status: supported
        installer: mise
        package: python
      lima-guest:
        status: supported
        installer: mise
        package: python

  - id: typescript
    name: TypeScript
    kind: language
    provides: [typescript, tsc]
    dependencies: [bun]
    version_policy:
      mode: pinned
      lock_key: typescript
    verification:
      command: [tsc, --version]
      functional: [bun, -e, "const value: number = 1; console.log(value)"]
    targets:
      macos-host:
        status: supported
        installer: bun
        package: typescript
      windows-host:
        status: unsupported
        reason: Primary language toolchains belong to the Linux guest.
      wsl-guest:
        status: supported
        installer: bun
        package: typescript
      lima-guest:
        status: supported
        installer: bun
        package: typescript

  - id: c-toolchain
    name: C Toolchain
    kind: language
    provides: [c, cc, build-essential]
    dependencies: [base-cli]
    version_policy:
      mode: manager
    verification:
      command: [cc, --version]
      functional: [cc, --help]
    targets:
      macos-host:
        status: action-required
        reason: Install macOS Command Line Tools with `xcode-select --install`.
      windows-host:
        status: action-required
        reason: Install MSVC Build Tools with the Desktop development with C++ workload.
      wsl-guest:
        status: supported
        installer: apt
        package: build-essential pkg-config
      lima-guest:
        status: supported
        installer: apt
        package: build-essential pkg-config

  - id: rust
    name: Rust and Cargo
    kind: language
    provides: [rust, rustc, cargo]
    dependencies: [base-cli]
    version_policy:
      mode: manager
    verification:
      command: [rustc, --version]
